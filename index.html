<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知識の書斎</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#eee8d9;background:#101e2a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#172a3b,#0b1721);min-height:100vh}.app{max-width:950px;margin:auto;padding:22px 18px 100px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #826d4d;padding-bottom:16px}h1{font-family:serif;letter-spacing:.1em;margin:4px 0;font-size:30px}.eyebrow{color:#c6a873;font-size:11px;letter-spacing:.2em}.sub{color:#b4b9bb;font-size:13px}.gold{color:#d9b879}button,input,textarea,select{font:inherit}button{cursor:pointer}.primary{background:#c5a16a;color:#142333;border:0;border-radius:9px;padding:11px 16px;font-weight:700}.ghost{background:#243749;color:#f0e5cf;border:1px solid #526171;border-radius:9px;padding:10px 13px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0 14px}input,textarea,select{background:#203447;color:#fff;border:1px solid #536170;border-radius:9px;padding:12px;min-width:0}input::placeholder,textarea::placeholder{color:#a8b3bd}.search{flex:1;min-width:180px}.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 16px}.chip{border:1px solid #4c5c69;background:#1d3040;color:#d9e0e4;padding:8px 12px;border-radius:30px;white-space:nowrap}.chip.active{background:#c5a16a;color:#152635;border-color:#c5a16a}.shelf{background:linear-gradient(#23384a,#192c3b);border:1px solid #415064;border-radius:14px;padding:18px 16px 0;margin:14px 0 22px;box-shadow:inset 0 2px 15px #101a25}.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:18px 15px}.book{background:transparent;border:0;color:inherit;text-align:left;padding:0;min-width:0}.cover{height:186px;width:100%;max-width:155px;box-shadow:5px 6px 9px #0a1520, inset -5px 0 #ffffff22;display:flex;flex-direction:column;justify-content:space-between;padding:14px 11px;border-radius:3px 7px 7px 3px;border-left:7px solid #ffffff33}.cover strong{font-family:serif;font-size:19px;line-height:1.35;overflow-wrap:anywhere}.cover small{font-size:10px}.booktitle{font-size:13px;font-weight:700;margin:13px 0 3px}.bookmeta{font-size:11px;color:#b9c3ca}.wood{height:16px;background:linear-gradient(#997147,#593c29,#34231c);margin:18px -16px 0;border-radius:0 0 10px 10px;box-shadow:0 7px 12px #060d14}.section{margin:27px 0 10px;display:flex;justify-content:space-between;align-items:center}.section h2{font-size:18px;margin:0;font-family:serif}.problem-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.problem{background:#21374a;border:1px solid #3d5467;border-radius:12px;color:#eee8d9;padding:17px 12px;text-align:left}.problem span{display:block;font-size:13px;margin-top:5px;color:#bac6cf}.panel{background:#1d3040;border:1px solid #445768;border-radius:13px;padding:18px;margin-top:16px}.tabs{position:fixed;bottom:0;left:0;right:0;background:#122332ee;backdrop-filter:blur(8px);border-top:1px solid #5b594c;display:flex;justify-content:center;gap:6px;padding:9px}.tabs button{background:transparent;border:0;color:#bac5ca;padding:8px 18px}.tabs button.active{color:#e5bd7b}.hidden{display:none!important}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;color:#c9c7bf}textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tag{font-size:11px;color:#e2c58c}.result{border-bottom:1px solid #445668;padding:12px 0}.result button{margin-top:7px}.empty{padding:30px;text-align:center;color:#c0c9cd}.note{color:#b5c4cf;font-size:12px;line-height:1.8}.back{background:none;color:#dcb77e;border:0;padding:10px 0}.detailhead{display:flex;gap:17px;align-items:start}.detailhead .cover{flex:0 0 125px;height:166px}.detailhead h2{margin:0 0 9px;font-family:serif}.summary{line-height:1.9;white-space:pre-wrap}.mindmap{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}.node{background:#304c5b;border:1px solid #ba9862;border-radius:12px;padding:12px;flex:1 1 135px;text-align:center;font-size:13px}.node.center{background:#aa8858;color:#142434;font-weight:bold;flex-basis:100%}footer{font-size:11px;color:#8e9da7;margin:25px 0;text-align:center}@media(min-width:650px){.problem-grid{grid-template-columns:repeat(4,1fr)}.cover{height:200px}.app{padding-top:35px}}
</style></head><body><main class="app"><header><div><div class="eyebrow">PERSONAL KNOWLEDGE LIBRARY</div><h1>知識の書斎</h1><div class="sub">読んだ本が、これからの自分を助ける。</div></div><div style="font-size:34px;color:#c5a16a">▥</div></header>
<section id="home"><div class="toolbar"><input id="search" class="search" placeholder="本のタイトル・著者・キーワードで検索"><button class="primary" onclick="showAdd()">＋ 本を登録</button></div><div id="chips" class="chips"></div><div class="section"><h2>あなたの本棚</h2><span id="count" class="sub"></span></div><div class="shelf"><div id="books" class="books"></div><div class="wood"></div></div><div class="section"><h2>こんなとき、何を読む？</h2></div><div class="problem-grid"><button class="problem" onclick="problem('人間関係')">人間関係<span>他人の評価・距離感</span></button><button class="problem" onclick="problem('思考')">考え方・判断<span>迷い・整理・決断</span></button><button class="problem" onclick="problem('仕事')">仕事・組織<span>会議・説明・リーダー</span></button><button class="problem" onclick="problem('成長')">習慣・成長<span>学び・行動・継続</span></button></div></section>
<section id="discover" class="hidden"><div class="section"><h2>悩みから探す</h2></div><p class="note">悩みを入力すると、登録済みの本のタグ・要約・メモから関連する本を探します。AIへの送信は行いません。</p><div class="toolbar"><input id="question" class="search" placeholder="例：上司への説明がうまくいかない"><button class="primary" onclick="findAdvice()">探す</button></div><div id="advice"></div></section>
<section id="editor" class="hidden"><button class="back" onclick="navigate('home')">← 本棚へ戻る</button><h2 id="editorTitle">本を登録</h2><div class="panel"><div class="field"><label>タイトル *</label><input id="title" placeholder="書籍タイトル"></div><div class="field"><label>著者</label><input id="author" placeholder="著者名"></div><div class="field"><label>ジャンル</label><select id="category"><option>心理・人間関係</option><option>思考・コミュニケーション</option><option>仕事・組織</option><option>習慣・自己成長</option><option>歴史・教養</option><option>その他</option></select></div><div class="field"><label>読書状況</label><select id="status"><option>読了</option><option>読書中</option><option>読みたい</option></select></div><div class="field"><label>関連キーワード（カンマ区切り）</label><input id="tags" placeholder="例：会議, 説明, 論理"></div><div class="field"><label>本の要点・要約（自分で確認した内容）</label><textarea id="summary"></textarea></div><div class="field"><label>自分の学び・感想</label><textarea id="memo"></textarea></div><div class="field"><label>マインドマップの枝（1行に1つ）</label><textarea id="branches" placeholder="課題の分離&#10;目的論"></textarea></div><div class="actions"><button class="primary" onclick="saveBook()">保存する</button><button class="ghost" onclick="navigate('home')">キャンセル</button><button id="delete" class="ghost hidden" onclick="deleteBook()">削除</button></div></div></section>
<section id="detail" class="hidden"><button class="back" onclick="navigate('home')">← 本棚へ戻る</button><div id="detailContent"></div></section><footer>試作版 Ver.0.1 · データはこのブラウザ内に保存されます</footer></main><nav class="tabs"><button id="tabhome" class="active" onclick="navigate('home')">▥ 本棚</button><button id="tabdiscover" onclick="navigate('discover')">⌕ 悩み検索</button><button onclick="showAdd()">＋ 登録</button></nav>
<script>
const KEY='shosai-books-v1';const sample=[{id:1,title:'嫌われる勇気',author:'岸見一郎・古賀史健',category:'心理・人間関係',status:'読了',tags:'人間関係,他人の評価,承認欲求,課題の分離,自由,成長',summary:'アドラー心理学を対話形式で紹介する本。目的論、課題の分離、承認欲求、共同体感覚などを通じて、自分の生き方を考える。\n※これは試作用の概要です。読書内容と照合して編集してください。',memo:'',branches:'目的論\nすべての悩みは対人関係\n課題の分離\n承認欲求からの自由\n共同体感覚',color:'#22578a',ink:'#fff'}, {id:2,title:'頭のいい人が話す前に考えていること',author:'安達裕哉',category:'思考・コミュニケーション',status:'読了',tags:'会議,説明,思考,論理,仕事,コミュニケーション,判断',summary:'話す前に考える習慣をテーマに、相手の理解や論理的な伝え方について学ぶ本。\n※これは試作用の概要です。読書内容と照合して編集してください。',memo:'',branches:'話す前に考える\n相手の立場を理解する\n論点を整理する\n伝わる言葉を選ぶ',color:'#ece5d4',ink:'#1a334b'}];let books = sample;
try {
  const stored = JSON.parse(localStorage.getItem(KEY));
  if (Array.isArray(stored)) books = stored;
} catch (error) {
  // The shelf can still display the examples when storage is unavailable.
}
let selected='すべて',editId=null,detailId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(nextBooks) {
  try {
    localStorage.setItem(KEY, JSON.stringify(nextBooks));
  } catch (error) {
    alert('保存できませんでした。ブラウザの保存設定や空き容量を確認してから、もう一度お試しください。');
    return false;
  }
  books = nextBooks;
  return true;
}
function navigate(page){['home','discover','editor','detail'].forEach(x=>$(x).classList.toggle('hidden',x!==page));$('tabhome').classList.toggle('active',page==='home');$('tabdiscover').classList.toggle('active',page==='discover');window.scrollTo(0,0);if(page==='home')render()}function cover(b){return `<div class="cover" style="background:${esc(b.color||'#52614c')};color:${esc(b.ink||'#fff')}"><small>BOOK NOTES</small><strong>${esc(b.title)}</strong><small>${esc(b.author)}</small></div>`}function render(){let cats=['すべて',...new Set(books.map(b=>b.category))];if(!cats.includes(selected))selected='すべて';$('chips').innerHTML=cats.map(c=>`<button class="chip ${selected===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{selected=x.dataset.cat;render()});let q=$('search').value.toLowerCase().trim();let list=books.filter(b=>(selected==='すべて'||b.category===selected)&&[b.title,b.author,b.category,b.tags,b.summary,b.memo].join(' ').toLowerCase().includes(q));$('count').textContent=`${books.length} 冊登録`; $('books').innerHTML=list.length?list.map(b=>`<button class="book" data-id="${b.id}">${cover(b)}<div class="booktitle">${esc(b.title)}</div><div class="bookmeta">${esc(b.status)} · ${esc(b.category)}</div></button>`).join(''):'<div class="empty">該当する本はありません</div>';document.querySelectorAll('.book').forEach(x=>x.onclick=()=>showDetail(Number(x.dataset.id)))}$('search').addEventListener('input',render);function showAdd(id=null){editId=id;let b=books.find(x=>x.id===id)||{};$('editorTitle').textContent=id?'本を編集':'本を登録';['title','author','category','status','tags','summary','memo','branches'].forEach(k=>{if(b[k]!==undefined)$(k).value=b[k];else $(k).value=k==='category'?'その他':k==='status'?'読みたい':''});$('delete').classList.toggle('hidden',!id);navigate('editor')}
function saveBook() {
  const title = $('title').value.trim();
  if (!title) {
    alert('タイトルを入力してください');
    return;
  }

  const old = books.find(book => book.id === editId);
  let id = editId;
  if (id === null) {
    id = Date.now();
    while (books.some(book => book.id === id)) id++;
  }
  const book = {
    ...old,
    id,
    title,
    color: old?.color || '#52614c',
    ink: old?.ink || '#fff',
  };
  ['author', 'category', 'status', 'tags', 'summary', 'memo', 'branches'].forEach(field => {
    book[field] = $(field).value.trim();
  });

  const nextBooks = editId === null
    ? [book, ...books]
    : books.map(current => current.id === editId ? book : current);
  if (persist(nextBooks)) showDetail(book.id);
}

function deleteBook() {
  if (!confirm('この本を削除しますか？')) return;
  const nextBooks = books.filter(book => book.id !== editId);
  if (persist(nextBooks)) navigate('home');
}

function showDetail(id){detailId=id;let b=books.find(x=>x.id===id);if(!b)return;let nodes=(b.branches||'').split('\n').filter(Boolean);$('detailContent').innerHTML=`<div class="detailhead">${cover(b)}<div><h2>${esc(b.title)}</h2><div class="sub">${esc(b.author)}</div><p class="tag">${esc(b.category)} · ${esc(b.status)}</p><button class="ghost" id="editDetail">編集する</button></div></div><div class="section"><h2>本の要点</h2></div><div class="panel summary">${esc(b.summary||'要約はまだ登録されていません。')}</div><div class="section"><h2>マインドマップ</h2></div><div class="panel"><div class="mindmap"><div class="node center">${esc(b.title)}</div>${nodes.map(n=>`<div class="node">${esc(n)}</div>`).join('')}</div><p class="note">枝は編集画面から追加・修正できます。</p></div><div class="section"><h2>自分の学びメモ</h2></div><div class="panel summary">${esc(b.memo||'まだメモはありません。編集から書き込めます。')}</div>`;$('editDetail').onclick=()=>showAdd(id);navigate('detail')}function problem(q){navigate('discover');$('question').value=q;findAdvice()}function findAdvice(){let q=$('question').value.trim();let words=q.split(/[\s、。！？?！]+/).filter(Boolean);let related={人間関係:['人間関係','評価','承認','対人'],思考:['思考','論理','判断'],仕事:['仕事','会議','説明','組織'],成長:['成長','習慣','自由']};let terms=[...words,...Object.entries(related).filter(([k])=>q.includes(k)).flatMap(([,v])=>v)];let scored=books.map(b=>{let hay=[b.title,b.category,b.tags,b.summary,b.memo].join(' ').toLowerCase();let score=terms.reduce((n,t)=>n+(hay.includes(t.toLowerCase())?1:0),0);return {b,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);$('advice').innerHTML=scored.length?`<div class="panel"><h3>関連する本 ${scored.length}冊</h3>${scored.map(({b})=>`<div class="result"><strong>${esc(b.title)}</strong><p class="note">関連タグ：${esc(b.tags||b.category)}</p><button class="ghost" data-result="${b.id}">内容を見る</button></div>`).join('')}</div>`:'<div class="panel">一致する本はまだありません。キーワードを変えるか、関連する本を登録してみてください。</div>';document.querySelectorAll('[data-result]').forEach(x=>x.onclick=()=>showDetail(Number(x.dataset.result)))}render();
</script></body></html>
